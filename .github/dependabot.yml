version: 2

updates:
  # Rust crates declared in Cargo.toml.
  # Cargo.lock is gitignored, so Dependabot can only raise the requirements
  # below -- it cannot see or patch transitive dependencies.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps arrive as one PR to keep review noise down;
      # majors stay separate so breaking changes get their own review.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base images in Dockerfile: rust:1.90-slim (builder), debian:trixie-slim (runtime).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5

  # Actions in .github/workflows. These are SHA-pinned; Dependabot bumps the
  # SHA and keeps the trailing "# vX.Y.Z" comment in sync.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
