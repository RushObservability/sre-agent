name: ci

on:
  pull_request:
    # Stacked PRs need the same checks as PRs targeting main. Include edited so
    # retargeting a PR also validates its new merge result.
    types: [opened, synchronize, reopened, edited, ready_for_review]

env:
  CARGO_TERM_COLOR: always

# Least privilege: this workflow only ever reads the repo. Without this block
# the token inherits the repository/org default, which is often read-write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Match rust-toolchain.toml and install the lint components.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --check
      - name: Test security report summaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: PR6 deterministic replay release gate
        run: |
          SRE_EVALS_RUN_ID=pr6-ci cargo run --bin sre_evals -- replay \
            --cases evals/replay_cases.yaml --out evals/out
          cargo run --bin sre_evals -- release-gate \
            --current evals/out/pr6-ci.json \
            --baseline evals/baseline-pr6.json

  timestamp-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-11-24
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-11-24 install cargo-fuzz --version 0.13.2 --locked
      - name: Test timestamp round trips with generated inputs
        run: |
          cargo +nightly-2026-11-24 metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          cargo +nightly-2026-11-24 fuzz run timestamp_roundtrip -- -max_total_time=10
