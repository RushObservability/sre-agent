[package]
name = "sre-agent"
version = "0.1.0"
edition = "2024"
default-run = "sre-agent"
description = "AI-powered SRE investigation agent for the Rush Observability platform"
license-file = "LICENSE"

[lib]
name = "sre_agent"
path = "src/lib.rs"

[[bin]]
name = "sre-agent"
path = "src/main.rs"

[dependencies]
# Web server
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
libc = "0.2"
tokio-stream = "0.1"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML for the eval harness case files (src/bin/sre_evals.rs).
serde_yaml = "0.9"

# ClickHouse client (for log/trace/metric queries + shared config tables)
clickhouse = { version = "0.13", features = ["time", "uuid"] }

# Kubernetes client (for argocd + kube tools)
kube = { version = "4.0", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for LLM calls; "stream" enables incremental SSE consumption).
# "query" is required from reqwest 0.13 on: RequestBuilder::query moved behind
# an opt-in feature, and it is not in the default set.
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
jsonwebtoken = "11"
flate2 = "1"
tar = "0.4"
walkdir = "2"
sha2 = "0.10"

# Utilities
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[dev-dependencies]
# HTTP oneshot tests: drive the production axum Router without a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
