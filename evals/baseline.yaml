# Baseline RCA eval — one CURATED case from a controlled, reversible fault injection.
# Fault: `docker pause wide-articles-1` (the articles backend froze; the gateway's
# GET /articles calls hang/fail and the articles service stops emitting telemetry).
# Ground truth is therefore known with certainty: root cause = articles down.
# Window/around are filled from the actual pause/unpause timestamps.
cases:
  - id: articles-down-cascade
    description: "Controlled fault: articles backend paused; gateway /articles degrades. Known root cause = articles unavailable."
    source: seeded
    input:
      kind: question
      text: "The gateway service started failing / slowing down on its /articles calls. Find the root cause."
      around: "2026-06-19T18:19:30Z"
    window:
      start: "2026-06-19T18:17:52Z"
      end: "2026-06-19T18:22:27Z"
    ground_truth:
      root_cause_service: articles
      reason: "The articles backend became unavailable (process frozen/down), so it stopped serving requests and emitting telemetry; the gateway's downstream calls to articles failed or timed out. The gateway is a symptom, not the cause."
      related:
        - articles

  - id: media-cpu-latency
    description: "Controlled fault: media backend CPU-throttled (0.04 CPU); it stays UP but slow, so gateway /media latency spikes (p95 ~0.5s, max ~5s) without an outage. Known root cause = media resource starvation."
    source: seeded
    input:
      kind: question
      text: "The gateway's /media calls got very slow (high p95/p99 latency) but are not failing outright. Find the root cause."
      around: "2026-06-19T22:04:30Z"
    window:
      start: "2026-06-19T22:02:21Z"
      end: "2026-06-19T22:06:32Z"
    ground_truth:
      root_cause_service: media
      reason: "The media service was CPU-starved (resource exhaustion / throttled), so its own request handling slowed dramatically; the gateway's calls to media inherited that latency. Media is slow but not down — the latency originates in media, and the gateway is a symptom."
      related:
        - media

  - id: users-down-cascade
    description: "Controlled fault: users backend paused; gateway /users calls hang/time out (~130s) and users stops emitting telemetry. Known root cause = users unavailable. (Different service than case 1 — guards against pattern-matching one service name.)"
    source: seeded
    input:
      kind: question
      text: "Requests to the gateway's /users endpoints are hanging and timing out. Find the root cause."
      around: "2026-06-19T22:08:20Z"
    window:
      start: "2026-06-19T22:06:32Z"
      end: "2026-06-19T22:10:11Z"
    ground_truth:
      root_cause_service: users
      reason: "The users backend became unavailable (process frozen/down): it stopped serving requests and emitting telemetry, so the gateway's calls to users hung until timeout. The gateway is a symptom; the root cause is users being down."
      related:
        - users
