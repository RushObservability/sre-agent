# Deterministic PR6 replay suite. These are report/tool-result fixtures, not
# claims about current production telemetry. They exercise the release scorer
# across the failure modes listed in the causal RCA PRD.
cases:
  - id: replay-service-down
    source: replay
    description: Service becomes unavailable and its caller times out.
    input: {kind: question, text: "The gateway is timing out on catalog requests. Find the root cause."}
    ground_truth: {root_cause_service: catalog, reason: "catalog is down and no longer serves requests", related: [gateway]}
    expectation: {mechanism_keywords: [down, unavailable, timeout], causal_path: [catalog, gateway], evidence_classes: [traces, logs], minimum_corroboration: 2, report_kind: final}
    replay:
      tenant_id: tenant-a
      wall_time_ms: 180
      prompt_tokens: 900
      completion_tokens: 180
      report: |
        ## Root Cause
        catalog is unavailable and down; gateway calls time out.
        ## Causal Chain
        catalog -> gateway timeout.
        ## Confidence
        0.94
      tool_results:
        - {name: query_traces, args: {service: catalog}, data: "catalog spans stopped; gateway timeout", tenant_id: tenant-a, source_family: traces, source_tables: [spans], status: ok}
        - {name: search_logs, args: {service: catalog}, data: "connection refused from catalog", tenant_id: tenant-a, source_family: logs, source_tables: [logs], status: ok}

